services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    ports:
      # localhost only: leadgate reaches n8n over leadnet, not this port.
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    # leadnet: talk to leadgate (http://leadgate-api:8000), and leadgate posts run
    # results back to http://n8n:5678/webhook/leadgate-results.
    networks: [default, leadnet]

volumes:
  n8n_data:

networks:
  default:
  # Made by leadgate's `docker compose up` (or once by hand: docker network create leadnet).
  leadnet:
    external: true
